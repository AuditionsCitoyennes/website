name: CI

# Lint, typecheck, tests, build and the DCO sign-off. The database checks are
# in ci-database.yml, which runs only when what they cover changes.
#
# Pull requests into dev (or main) only. A pull request stacked on another one
# is checked once it targets dev: when GitHub retargets it after its parent is
# merged (an "edited" event that changes the base), or on its next push.
# Checking every pull request of a stack on each of its rebases took about a
# third of the Actions minutes of early November 2026.
on:
  pull_request:
    branches: [dev, main]
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main, dev]

# Annule les exécutions précédentes sur la même branche/PR. An edit that leaves
# the base as it is (title, description) gets a group of its own, so that it
# does not cancel a check under way.
concurrency:
  group: ci-${{ github.ref }}${{ github.event.action == 'edited' && !github.event.changes.base && format('-edit-{0}', github.run_id) || '' }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck & build
    # An edit that leaves the base as it is runs nothing.
    if: github.event.action != 'edited' || github.event.changes.base
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The whole history (a few MB), for the sign-off check below. A pull
          # request is checked out as its merge commit: its first parent is the
          # base branch.
          fetch-depth: 0

      # A migration on the base branch has run on staging and prod, where an
      # edit to it would never apply: a change is a new migration.
      - name: Migrations of the base branch are left as they are
        if: github.event_name == 'pull_request'
        run: |
          changed=$(git diff --no-renames --diff-filter=MD --name-only HEAD^1 HEAD -- supabase/migrations)
          if [ -n "$changed" ]; then
            echo "::error::Migrations already on ${{ github.base_ref }} were changed or removed: $changed"
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Test (API cache)
        run: npm run test --workspace=@ac/api

      - name: Test (scripts)
        run: npm run test:scripts

      # The SQL helpers of the testimonies' derived columns are generated from
      # @ac/shared: a change on one side only fails here.
      - name: Generated SQL matches @ac/shared
        run: npm run db:sql-gen -- --check

      - name: Build
        run: npm run build

      # Vérifie que chaque commit d'une PR porte une ligne "Signed-off-by"
      # (Developer Certificate of Origin). Voir CONTRIBUTING.md#sign-off-dco.
      # It runs even when an earlier step failed, so both show. Until November
      # 2026 it was a workflow of its own (dco.yml): a 6-second job, billed as
      # a full minute on every push of every pull request.
      - name: Every commit is signed off (DCO)
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          fail=0
          for c in $(git rev-list "$BASE_SHA".."$HEAD_SHA"); do
            # Ignore les commits de merge
            if [ "$(git show -s --format=%p "$c" | wc -w)" -gt 1 ]; then
              continue
            fi
            if ! git show -s --format=%B "$c" | grep -qiE "^Signed-off-by: .+ <.+@.+>"; then
              subject=$(git show -s --format=%s "$c")
              echo "::error::Commit $c manque la ligne Signed-off-by — \"$subject\""
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo ""
            echo "Ajoutez le sign-off : git commit -s  (ou rattrapez avec : git rebase --signoff <base>)"
            echo "Voir CONTRIBUTING.md#sign-off-dco"
            exit 1
          fi
          echo "✅ Tous les commits sont signés (DCO)."
