name: Deploy staging site

# The web app on Cloudflare (apps/web/wrangler.jsonc). Every merge into dev
# that touches it goes to https://staging.auditionscitoyennes.com; every pull
# request gets its own preview, pr-<number>-auditions-staging.<account>.workers.dev,
# linked from the pull request's checks ("Staging preview"). Both talk to the
# staging API through the Worker's /api. Setup: docs/staging.md.
on:
  push:
    branches: [dev]
    paths:
      - "apps/web/**"
      - "packages/shared/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-staging-web.yml"
      - "scripts/deploy/outlines.sh"
  pull_request:
    paths:
      - "apps/web/**"
      - "packages/shared/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-staging-web.yml"
      - "scripts/deploy/outlines.sh"
  workflow_dispatch:

# A newer push to the same pull request (or to dev) replaces the running one.
concurrency:
  group: deploy-staging-web-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  statuses: write

env:
  WRANGLER: wrangler@4.152.0
  WORKER: auditions-staging
  SITE: https://staging.auditionscitoyennes.com
  CLOUDFLARE_API_TOKEN: ${{ secrets.STAGING_CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  deploy:
    # Pull requests from a fork, and Dependabot's, get no secrets: no preview
    # for them (the repository is public, so anyone may open one).
    if: >-
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Check the settings
        env:
          PROXY_SECRET: ${{ secrets.STAGING_PROXY_SECRET }}
        run: |
          missing=""
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID PROXY_SECRET; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Not set:$missing — see docs/staging.md"
            exit 1
          fi

      - run: npm ci --no-audit --no-fund

      # The outline build apps/web/outlines.lock.json names, from its GitHub
      # release (docs/map-outlines.md "Hosting"): fetched before the build, so
      # a build not released fails the deploy in seconds. No skip: a deploy
      # without the files would fall back to the API without a word.
      - name: Fetch the outline build
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/deploy/outlines.sh fetch

      # Public values only: what the browser gets anyway.
      - name: Build
        env:
          VITE_APP_ENV: staging
          # The Analyses, kept on staging while they mature (docs/feature-flags.md).
          VITE_ANALYSES: "on"
          VITE_SUPABASE_URL: https://papnqtvugzqtllcwigfi.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_uqMDtN2yFb6Y6h3gHPfYOA_Xa6lAmHK
          # Empty: the API is the site's own /api (the Worker forwards it).
          VITE_API_URL: ""
          VITE_MAPBOX_TOKEN: ${{ vars.MAPBOX_TOKEN }}
          VITE_MAPBOX_STYLE: ${{ vars.MAPBOX_STYLE }}
        run: |
          npm run build --workspace=@ac/web
          # Staging is not for search engines. Appended: the build's own
          # _headers (apps/web/public/_headers: the cache rule of /assets/*)
          # comes first.
          printf '\n/*\n  X-Robots-Tag: noindex, nofollow\n' >> apps/web/dist/_headers
          printf 'User-agent: *\nDisallow: /\n' > apps/web/dist/robots.txt

      # Same origin: the app reads /map-data/outlines/<build>/ (VITE_MAP_DATA_BASE
      # unset), from the same lock the build just baked in.
      - name: Add the outline build
        id: outlines
        run: scripts/deploy/outlines.sh install

      - name: Deploy
        id: deploy
        working-directory: apps/web
        env:
          PROXY_SECRET: ${{ secrets.STAGING_PROXY_SECRET }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          secrets="$RUNNER_TEMP/secrets.env"
          trap 'rm -f "$secrets"' EXIT
          printf 'PROXY_SECRET=%s\n' "$PROXY_SECRET" > "$secrets"

          # A preview is a version of the Worker: the very first run, from a
          # pull request, creates the Worker first (404: none yet).
          exists=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER/settings")
          if [ -z "$PR" ] || [ "$exists" = 404 ]; then
            npx --yes "$WRANGLER" deploy --secrets-file "$secrets" --message "$GITHUB_SHA"
          fi

          if [ -n "$PR" ]; then
            out=$(npx --yes "$WRANGLER" versions upload --preview-alias "pr-$PR" \
              --secrets-file "$secrets" --message "PR #$PR $GITHUB_SHA")
            echo "$out"
            url=$(grep -oE "https://pr-$PR-$WORKER\.[a-z0-9-]+\.workers\.dev" <<<"$out" | head -1)
          else
            url=$SITE
          fi
          if [ -z "$url" ]; then
            echo "::error::no preview URL in wrangler's output"
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      # The site answers, its pages are the app's, and its /api reaches the
      # API with the visitor's address: Cloudflare's /cdn-cgi/trace says what
      # address it saw, /api/health what the API saw — the same, or the rate
      # limits would put every visitor together.
      - name: Check the site
        env:
          URL: ${{ steps.deploy.outputs.url }}
          BUILD: ${{ steps.outlines.outputs.build }}
          LARGEST: ${{ steps.outlines.outputs.largest }}
          # The deploy's own pass through the gate (Cloudflare Access): a
          # service token, allowed by the gate's "Service Auth" policy.
          ACCESS_ID: ${{ secrets.STAGING_ACCESS_CLIENT_ID }}
          ACCESS_SECRET: ${{ secrets.STAGING_ACCESS_CLIENT_SECRET }}
        run: |
          get() {
            if [ -n "$ACCESS_ID" ]; then
              curl -4 -H "CF-Access-Client-Id: $ACCESS_ID" -H "CF-Access-Client-Secret: $ACCESS_SECRET" "$@"
            else
              curl -4 "$@"
            fi
          }
          # A new domain waits for its certificate (minutes, the first time).
          for _ in $(seq 1 60); do
            code=$(get -s --max-time 10 -o /dev/null -w '%{http_code}' "$URL/" || true)
            [ "$code" = 200 ] && break
            # Sent to the gate's sign-in page: the deploy has no pass.
            if [ "$code" = 302 ] || [ "$code" = 401 ] || [ "$code" = 403 ]; then
              echo "::error::$URL answers $code: behind the gate, and STAGING_ACCESS_CLIENT_ID / _SECRET are missing or not allowed by its Service Auth policy (docs/staging.md)"
              exit 1
            fi
            sleep 10
          done
          get -sSf --max-time 10 "$URL/" | grep -q '<div id="app"'
          get -sSf --max-time 10 "$URL/temoignages" | grep -q '<div id="app"'
          seen=$(get -sSf --max-time 10 "$URL/cdn-cgi/trace" | sed -n 's/^ip=//p')
          # The API may be redeploying at the same time (a merge touching
          # both): it has a few minutes to come back with the shared secret.
          for _ in $(seq 1 30); do
            health=$(get -sSf --max-time 20 "$URL/api/health")
            api=$(jq -r .ip <<<"$health")
            [ "$api" = "$seen" ] && break
            sleep 10
          done
          echo "$health" | jq .
          [ "$(jq -r .serviceRole <<<"$health")" = "true" ]
          # A route the API keeps for the site's Worker (REQUIRE_PROXY): the
          # Worker vouches for the request with the shared secret. A place
          # read, through the service role's read functions — never a
          # whole-table pull (/api/auditions refuses past 5,000 auditions).
          facets=$(get -sSf --max-time 30 "$URL/api/places/facets")
          jq -e '.themes | type == "array"' <<<"$facets" >/dev/null
          if [ "$api" != "$seen" ]; then
            echo "::error::the API sees $api, Cloudflare saw $seen: the visitor's address is lost (STAGING_PROXY_SECRET on both sides?)"
            exit 1
          fi
          {
            echo "### Staging site deployed"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| URL | $URL |"
            echo "| Commit | \`$GITHUB_SHA\` |"
            echo "| API version | \`$(jq -r .version <<<"$health")\` |"
            echo "| Visitor's address, as Cloudflare and the API see it | \`$api\` |"
          } >> "$GITHUB_STEP_SUMMARY"

          # The outline build (scripts/deploy/outlines.sh): its root.json is
          # that build's, as JSON, immutable. A path that is no file answers
          # the app's page with a 200 too, so the body is read, not the status.
          base="$URL/map-data/outlines/$BUILD"
          root=$(get -sSf --max-time 20 -D "$RUNNER_TEMP/root.headers" "$base/root.json" || true)
          if ! jq -e --arg b "$BUILD" '.v == 1 and .build == $b' <<<"$root" >/dev/null 2>&1 ||
            ! grep -qi '^content-type: application/json' "$RUNNER_TEMP/root.headers" ||
            ! grep -qi '^cache-control:.*immutable' "$RUNNER_TEMP/root.headers"; then
            echo "::error::outline build $BUILD not served: see docs/map-outlines.md \"Hosting\""
            exit 1
          fi
          # Evidence only (docs/map-outlines.md "Hosting"): the bytes on the
          # wire with and without compression (curl decodes nothing without
          # --compressed), and what a file that is not there gets.
          header() { # NAME, the response's headers on stdin
            { grep -i "^$1:" || true; } | head -1 | cut -d: -f2- | tr -d '\r' | sed 's/^ *//'
          }
          status() { head -1 | awk '{print $2}'; }
          bytes() { sed -n 's/^size_download=//p'; }
          {
            echo ""
            echo "### Outline build \`$BUILD\` on the site"
            echo ""
            echo "| File | Status | Content-Type | Cache-Control | Content-Encoding | Bytes (gzip, br) | Bytes (identity) | Ratio |"
            echo "|---|---|---|---|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          for f in root.json k/fr_dep_69.json "$LARGEST"; do
            zipped=$(get -s --max-time 30 -o /dev/null -D - -w 'size_download=%{size_download}\n' \
              -H 'Accept-Encoding: gzip, br' "$base/$f" || true)
            plain=$(get -s --max-time 30 -o /dev/null -D - -w 'size_download=%{size_download}\n' \
              -H 'Accept-Encoding: identity' "$base/$f" || true)
            zb=$(bytes <<<"$zipped")
            pb=$(bytes <<<"$plain")
            ratio=$(awk -v z="${zb:-0}" -v p="${pb:-0}" 'BEGIN { if (z > 0) printf "%.2fx", p / z; else print "-" }')
            row="| \`$f\` | $(status <<<"$zipped") | $(header content-type <<<"$zipped") | $(header cache-control <<<"$zipped") | $(header content-encoding <<<"$zipped") | $zb | $pb | $ratio |"
            echo "$row"
            echo "$row" >> "$GITHUB_STEP_SUMMARY"
          done
          {
            echo ""
            echo "| Missing file \`k/fr_dep_zz.json\` | Status | Content-Type | Cache-Control |"
            echo "|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          # cors is what the app's fetch() sends, navigate what a page load
          # sends. Cloudflare documents the app's page for navigations only
          # (anything else runs the Worker: the API's answer), and wrangler
          # dev takes every request as one: these rows show which it is.
          for mode in plain cors navigate; do
            extra=()
            case $mode in
              cors) extra=(-H 'Sec-Fetch-Mode: cors' -H 'Sec-Fetch-Dest: empty') ;;
              navigate) extra=(-H 'Sec-Fetch-Mode: navigate' -H 'Sec-Fetch-Dest: document') ;;
            esac
            missing=$(get -s --max-time 20 -o /dev/null -D - "${extra[@]}" "$base/k/fr_dep_zz.json" || true)
            row="| $mode | $(status <<<"$missing") | $(header content-type <<<"$missing") | $(header cache-control <<<"$missing") |"
            echo "$row"
            echo "$row" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Link the preview from the pull request
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ steps.deploy.outputs.url }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA" \
            -f state=success -f context="Staging preview" \
            -f description="Open this pull request's site" -f target_url="$URL" >/dev/null
