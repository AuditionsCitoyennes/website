name: DCO

# Vérifie que chaque commit d'une PR porte une ligne "Signed-off-by"
# (Developer Certificate of Origin). Voir CONTRIBUTING.md#sign-off-dco.

on:
  pull_request:

jobs:
  check:
    name: Check sign-off
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify Signed-off-by on every commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          fail=0
          for c in $(git rev-list "$BASE_SHA".."$HEAD_SHA"); do
            # Ignore les commits de merge
            if [ "$(git show -s --format=%p "$c" | wc -w)" -gt 1 ]; then
              continue
            fi
            if ! git show -s --format=%B "$c" | grep -qiE "^Signed-off-by: .+ <.+@.+>"; then
              subject=$(git show -s --format=%s "$c")
              echo "::error::Commit $c manque la ligne Signed-off-by — \"$subject\""
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo ""
            echo "Ajoutez le sign-off : git commit -s  (ou rattrapez avec : git rebase --signoff <base>)"
            echo "Voir CONTRIBUTING.md#sign-off-dco"
            exit 1
          fi
          echo "✅ Tous les commits sont signés (DCO)."
