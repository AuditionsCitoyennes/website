version: 2
updates:
  # Dépendances npm (monorepo workspaces — le lockfile est à la racine)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      # Regroupe les mises à jour mineures/patch en une seule PR
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # Mises à jour des GitHub Actions utilisées dans les workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
