version: 2
updates:
  # Dépendances npm (monorepo workspaces — le lockfile est à la racine)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      # Regroupe les mises à jour mineures/patch en 2 PR (prod / dev)
      production:
        dependency-type: "production"
        update-types: ["minor", "patch"]
      development:
        dependency-type: "development"
        update-types: ["minor", "patch"]
    ignore:
      # Les montées de version MAJEURE se font à la main (souvent breaking)
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Mises à jour des GitHub Actions, regroupées en une seule PR
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      actions:
        patterns: ["*"]

  # L'image de base de l'API (node:24-slim, apps/api/Dockerfile) : correctifs
  # seulement. Une version majeure de Node se choisit à la main, et seulement
  # une LTS (paire) : Dependabot proposerait aussi les impaires, sans support
  # long (node:25 a fini le sien en juin 2026).
  - package-ecosystem: "docker"
    directory: "/apps/api"
    schedule:
      interval: "monthly"
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
